<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Interruptor 3D MAP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Prueba: el interruptor de la portada como objeto 3D sobre la carta. Tema único, colores explícitos. */
:root{--fondo:#1d1f1e;--rotulo:#e9e4d4;--lampara:#e9a23b;--senal:#f08a6c;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--fondo);color:var(--rotulo);font-family:var(--mono);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#escena{position:fixed;inset:0;background:url("assets/carta/carta-1932.jpg") 46% 52%/1500px auto,var(--fondo)}
#escena::after{content:"";position:absolute;inset:0;background:rgba(22,23,21,.42);pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab}
canvas.arrastre{cursor:grabbing}
.rotulos{position:fixed;z-index:2;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:6px;text-align:center;pointer-events:none;padding:0 16px}
.rotulos b{font-size:12px;letter-spacing:.2em;font-weight:600}
.rotulos span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.rotulos em{font-style:normal;color:var(--senal);font-size:10px;letter-spacing:.1em;text-transform:uppercase;min-height:1.3em}
.ficha{position:fixed;z-index:2;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6;background:rgba(48,52,50,.56);border:1px solid rgba(233,228,212,.22);border-radius:6px;padding:8px 12px;pointer-events:none}
.sinwebgl{position:fixed;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px;font-size:12px;letter-spacing:.08em}
</style>

<div id="escena" aria-hidden="true"></div>
<div class="ficha">Prueba · Interruptor 3D<br>three.js r128</div>
<div class="rotulos" aria-live="polite">
  <b id="estado">OFF</b>
  <span>Arrastre para girarlo · toque la palanca para encender</span>
  <em id="nota"></em>
</div>
<div class="sinwebgl" id="sinwebgl" hidden>Este navegador no puede mostrar 3D. En el sitio real, aquí aparecería el interruptor fotográfico.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){$("#sinwebgl").hidden=false;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,100);
camera.position.set(0,.6,13.5);

/* --- reflejos: un estudio fotográfico mínimo convertido en mapa de entorno --- */
const pmrem=new THREE.PMREMGenerator(renderer);
const estudio=new THREE.Scene(); estudio.background=new THREE.Color(0x2a2c2b);
const panel=(w,h,x,y,z,ry,int)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(int,int,int),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);estudio.add(m)};
panel(10,3,0,7,4,0,6); panel(3,10,-8,1,3,0,3.2); panel(3,8,8,0,5,0,2.2); panel(14,2,0,-6,6,0,.9);
const piso=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({color:0x6b6455}));piso.rotation.x=-Math.PI/2;piso.position.y=-9;estudio.add(piso);
scene.environment=pmrem.fromScene(estudio,.04).texture;

/* --- texturas pintadas a mano en canvas --- */
function lienzo(w,h,f){const c=document.createElement("canvas");c.width=w;c.height=h;f(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t}
// acero cepillado con la X estampada
const cepillo=(g,w,h,base)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){const y=Math.random()*h,a=Math.random()*.08;g.fillStyle=Math.random()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;g.fillRect(0,y,w,Math.random()*1.6+.3)}};
const equis=(g,w,h,col,ancho)=>{g.strokeStyle=col;g.lineWidth=ancho;g.lineCap="round";g.beginPath();g.moveTo(w*.12,h*.1);g.lineTo(w*.88,h*.9);g.moveTo(w*.88,h*.1);g.lineTo(w*.12,h*.9);g.stroke()};
const texBase=lienzo(1024,1200,(g,w,h)=>{cepillo(g,w,h,"#a3a6a4");equis(g,w,h,"rgba(255,255,255,.28)",58);equis(g,w,h,"rgba(0,0,0,.12)",30)});
texBase.encoding=THREE.sRGBEncoding;
const relieve=lienzo(512,600,(g,w,h)=>{g.fillStyle="#000";g.fillRect(0,0,w,h);g.filter="blur(6px)";equis(g,w,h,"#fff",34)});
// placa ON / OFF recortada
const placaW=512,placaH=1100;
const formaPlaca=(g,w,h)=>{g.beginPath();g.roundRect?g.roundRect(w*.14,0,w*.72,h*.36,26):g.rect(w*.14,0,w*.72,h*.36);g.arc(w/2,h/2,w*.5,0,Math.PI*2);g.roundRect?g.roundRect(w*.12,h*.64,w*.76,h*.36,26):g.rect(w*.12,h*.64,w*.76,h*.36)};
const texPlaca=lienzo(placaW,placaH,(g,w,h)=>{
  g.save();formaPlaca(g,w,h);g.clip();cepillo(g,w,h,"#c3c6c4");g.restore();
  g.fillStyle="#b3261c";g.fillRect(w*.2,h*.04,w*.6,h*.2);
  g.fillStyle="#141514";g.fillRect(w*.18,h*.76,w*.64,h*.2);
  g.fillStyle="#f4f1ea";g.textAlign="center";g.textBaseline="middle";g.font="900 150px Arial Black, Arial, sans-serif";
  g.fillText("ON",w/2,h*.145);g.fillText("OFF",w/2,h*.865);
});
texPlaca.encoding=THREE.sRGBEncoding;
const alfaPlaca=lienzo(placaW,placaH,(g,w,h)=>{g.fillStyle="#000";g.fillRect(0,0,w,h);g.fillStyle="#fff";formaPlaca(g,w,h);g.fill()});

/* --- materiales --- */
const acero=new THREE.MeshStandardMaterial({map:texBase,metalness:.85,roughness:.38,bumpMap:relieve,bumpScale:.05});
const placaMat=new THREE.MeshStandardMaterial({map:texPlaca,alphaMap:alfaPlaca,transparent:false,alphaTest:.5,metalness:.55,roughness:.32});
const cromo=new THREE.MeshStandardMaterial({color:0xd9dcda,metalness:1,roughness:.14});
const oscuro=new THREE.MeshStandardMaterial({color:0x2a2c2b,metalness:.6,roughness:.5});
const cobre=new THREE.MeshStandardMaterial({color:0x8a4a2e,metalness:.2,roughness:.7});

/* --- el aparato --- */
const aparato=new THREE.Group(); scene.add(aparato);
const base=new THREE.Mesh(new THREE.BoxGeometry(4.2,4.9,.32),[oscuro,oscuro,oscuro,oscuro,acero,oscuro]);
base.castShadow=base.receiveShadow=true; aparato.add(base);
const fondo=new THREE.Mesh(new THREE.BoxGeometry(3.6,4.3,.6),cobre); fondo.position.z=-.45; aparato.add(fondo);
const placa=new THREE.Mesh(new THREE.PlaneGeometry(2.3,4.94),placaMat); placa.position.z=.18; placa.receiveShadow=true; aparato.add(placa);
const tuerca=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,.34,6),cromo); tuerca.rotation.x=Math.PI/2; tuerca.rotation.y=Math.PI/6; tuerca.position.z=.36; tuerca.castShadow=true; aparato.add(tuerca);
const arandela=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.3,48),cromo); arandela.rotation.x=Math.PI/2; arandela.position.z=.62; aparato.add(arandela);
const buje=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,16,48),oscuro); buje.position.z=.8; aparato.add(buje);
// palanca: pivota en el buje
const pivote=new THREE.Group(); pivote.position.z=.78; aparato.add(pivote);
const vara=new THREE.Mesh(new THREE.CylinderGeometry(.17,.27,1.75,40),cromo); vara.position.y=.88; vara.castShadow=true;
const bola=new THREE.Mesh(new THREE.SphereGeometry(.31,48,32),cromo); bola.position.y=1.8; bola.scale.set(1,.9,1); bola.castShadow=true;
const brazo=new THREE.Group(); brazo.add(vara,bola); brazo.rotation.x=Math.PI/2; pivote.add(brazo);
const ANG={on:-.62,off:.62}; pivote.rotation.x=ANG.off;

/* --- luz --- */
scene.add(new THREE.HemisphereLight(0xfff6e5,0x2a2c2b,.35));
const sol=new THREE.DirectionalLight(0xfff1dc,1.6); sol.position.set(-5,6,9); sol.castShadow=true; sol.shadow.mapSize.set(1024,1024); sol.shadow.camera.left=-5;sol.shadow.camera.right=5;sol.shadow.camera.top=5;sol.shadow.camera.bottom=-5; scene.add(sol);

/* --- tamaño --- */
function medir(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.z=w/h<.75?20:13.5;camera.updateProjectionMatrix()}
addEventListener("resize",medir); medir();

/* --- interacción: arrastrar para girar, tocar para encender --- */
const rot={x:.18,y:-.35,tx:.18,ty:-.35};
let arr=null, movio=false;
const cv=renderer.domElement;
cv.addEventListener("pointerdown",e=>{arr={x:e.clientX,y:e.clientY,rx:rot.tx,ry:rot.ty};movio=false;cv.setPointerCapture(e.pointerId);cv.classList.add("arrastre")});
cv.addEventListener("pointermove",e=>{
  if(!arr){const nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;rot.tx=.18+ny*.25;rot.ty=-.35+nx*.5;return}
  const dx=e.clientX-arr.x,dy=e.clientY-arr.y; if(Math.hypot(dx,dy)>5)movio=true;
  rot.ty=Math.max(-1.1,Math.min(1.1,arr.ry+dx*.008)); rot.tx=Math.max(-.6,Math.min(.8,arr.rx+dy*.006));
});
cv.addEventListener("pointerup",e=>{cv.classList.remove("arrastre");const a=arr;arr=null;if(!movio)alternar(e)});
const clack=new Audio("assets/sonidos/clack.mp3"); clack.preload="auto";
let encendido=false, objetivo=ANG.off, vel=0;
function alternar(){
  encendido=!encendido; objetivo=encendido?ANG.on:ANG.off;
  try{clack.currentTime=0;clack.play().catch(()=>{})}catch(e){}
  $("#estado").textContent=encendido?"ON":"OFF";
  $("#nota").textContent=encendido?"En la portada real, aquí arrancaría la transmisión en Morse":"";
}
addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();alternar()}});

/* --- bucle --- */
let ultimo=performance.now();
function cuadro(now){
  const dt=Math.min(.05,(now-ultimo)/1000); ultimo=now;
  // resorte con rebote: la palanca salta y se asienta
  const k=reduce?400:900, amort=reduce?60:22;
  vel+=(objetivo-pivote.rotation.x)*k*dt; vel*=Math.exp(-amort*dt); pivote.rotation.x+=vel*dt;
  rot.x+=(rot.tx-rot.x)*.08; rot.y+=(rot.ty-rot.y)*.08;
  aparato.rotation.set(rot.x,rot.y,0);
  if(!arr&&!reduce) rot.ty+=Math.sin(now/2600)*.0006;
  renderer.render(scene,camera);
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
})();
</script>
</body></html>
