<style>
:root{--ar-papel:#F4F3EF;--ar-tinta:#14120E;--ar-acento:#E8412C;--ar-plano:#2C5876;--ar-tiza:#B9B6AC;

.tv,.tv *,.tv *::before,.tv *::after{box-sizing:border-box}
.tv{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:var(--ar-tinta);color:var(--ar-papel);font-family:var(--ar-txt);display:flex;flex-direction:column}

/* capas del televisor */

.tv__estatica{position:absolute;inset:-60px;pointer-events:none;opacity:.32;mix-blend-mode:screen;

.tv__barrido{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.tv__vineta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.78) 100%)}
.tv__franja{position:absolute;left:0;right:0;height:18vh;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(244,243,239,.05),transparent);animation:tv-franja 6s linear infinite}

.tv__volver:hover,.tv__volver:focus-visible{background:var(--ar-papel);color:var(--ar-tinta);outline:none}

.tv__tele a:hover,.tv__tele a:focus-visible{background:var(--ar-papel);color:var(--ar-tinta);outline:none}
